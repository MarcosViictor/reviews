version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgres://postgres:root@db:5432/reviews  # Ajustado conforme suas configs
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy  # Espera até que o banco esteja saudável antes de iniciar o Django
    deploy:
      replicas: 3  # Define 3 réplicas do contêiner Django

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: reviews
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
