services:
  web1:
    build:
      context: .  # Diretório onde está o Dockerfile
    container_name: django_app_1
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgresql-master
    networks:
      - app-network

  web2:
    build:
      context: .
    container_name: django_app_2
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgresql-master
    networks:
      - app-network

  postgresql-master:
    image: docker.io/bitnami/postgresql:17
    container_name: postgres_master
    ports:
      - '5432:5432'
    volumes:
      - 'postgresql_master_data:/bitnami/postgresql'
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=${DB_USER}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD}
      - POSTGRESQL_DATABASE=${DB_NAME}
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - app-network

  postgresql-slave:
    image: docker.io/bitnami/postgresql:17
    container_name: postgres_slave
    ports:
      - '5433:5432'
    depends_on:
      - postgresql-master
    volumes:
      - 'postgresql_slave_data:/bitnami/postgresql'
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgres_master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_PASSWORD=${DB_PASSWORD}
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"  # Porta exposta para acesso externo
    depends_on:
      - web1
      - web2
    networks:
      - app-network

volumes:
  postgres_data:
  postgresql_master_data:
    driver: local
  postgresql_slave_data:
    driver: local

networks:
  app-network:
