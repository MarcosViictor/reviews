services:
  web1:
    build:
      context: .  # Diretório onde está o Dockerfile
    container_name: django_app_1
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-network
    ports:
      - "8001:8000"  # Mapeia a porta 8001 do host para a porta 8000 do container

  web2:
    build:
      context: .
    container_name: django_app_2
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-network
    ports:
      - "8002:8000"  # Mapeia a porta 8002 do host para a porta 8000 do container

  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"  # Porta exposta para acesso externo
    depends_on:
      - web1
      - web2
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
