
services:
  web1:
    build:
      context: .
    container_name: django_app_1
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db_primary
    networks:
      - app-network

  web2:
    build:
      context: .
    container_name: django_app_2
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db_primary
    networks:
      - app-network

  db_primary:
    image: postgres:13
    container_name: postgres_primary
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./primary:/docker-entrypoint-initdb.d
    networks:
      - app-network

  db_replica:
    image: postgres:13
    container_name: postgres_replica
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./replica:/docker-entrypoint-initdb.d
    networks:
      - app-network
    depends_on:
      - db_primary
    user: postgres
    command: ["bash", "/docker-entrypoint-initdb.d/init_replica.sh"]

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - web1
      - web2
    networks:
      - app-network

volumes:
  postgres_primary_data:
  postgres_replica_data:

networks:
  app-network:
