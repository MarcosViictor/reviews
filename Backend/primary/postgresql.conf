# # Configurações para permitir a replicação
# wal_level = replica
# max_wal_senders = 10
# wal_keep_size = 64
# listen_addresses = '*'

wal_level = replica           # Habilita a replicação
max_wal_senders = 3         # Número máximo de conexões de envio de WAL (Write-Ahead Logging)
hot_standby = on              # Permite leitura durante a replicação no servidor de réplica
